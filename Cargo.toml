[workspace]
resolver = "2"
members = [
    "crates/awili-image-content",
    "crates/awili-core",
    "crates/awili-council",
    "crates/awili-engine",
    "crates/awili-attest-types",
    "crates/awili-attest",
    "crates/awili-engine-log",
    "crates/awili-engine-authz",
    "crates/awili-engine-sandbox",
    "crates/awili-tools",
    "crates/awili-builtins",
    "crates/awili-seam",
    "crates/awili-work",
    "crates/awili-engine-worker",
    "crates/awili-mcp-testserver",
    "crates/awili-config",
    "crates/awili-winacl",
    "crates/awili-providers",
    "crates/awili-ccd",
    "crates/awili-code",
    "crates/awili-gateway",
    "crates/awili-memory",
    "crates/awili-persist",
    "crates/awili-voice",
    "crates/awili-feed",
    "crates/awili-app",
    # Design-token ratchet (slice 2): pure-text scanner + baseline, no gpui.
    "crates/awili-design-lint",
    "crates/awili-dispatch",
    "crates/awili-selftest",
    "crates/awili-skills",
    "crates/awili-connectors",
]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/justinbukoski/awili"
edition = "2021"
version = "0.3.0-rc.3"

# Shared dependency versions. The HTTP/serde/async stack is pinned to match the
# versions gpui's own workspace resolves (see the zed-gpui-fork Cargo.toml) so
# Cargo unifies a single copy of each across our crates and gpui.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Comment/format-preserving TOML editing for the settings panel (slice 7): the
# same backend toml 0.8 already uses, so no new parser enters the tree.
toml_edit = "0.22"
dirs = "6"
# Conversation ids (slice 7). v4 = random; the only feature we need.
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-channel = "2"
# reqwest from the registry (gpui patches its own to a fork; ours is independent).
# The blocking client keeps provider/memory transport off any tokio runtime we'd
# have to own — it reads the streaming body via std::io::Read on a worker thread.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
# http types (Response/StatusCode) — already in the tree transitively via reqwest
# 0.12 (which re-exports these). Used only in tests to construct in-memory
# `reqwest::blocking::Response`s; pins no new fetch.
http = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# Attachment data URIs (slice 19 §2) — the same 0.22 copy already in the tree
# transitively, so no second base64 enters the build.
base64 = "0.22"
# Calendar-day arithmetic for the usage API (slice-8 review SF5):
# `Store::daily_usage(date: NaiveDate)`. No clock, no timezone database —
# NaiveDate is pure date math, so the minimal feature set suffices.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Voice (slice 3). whisper-rs builds whisper.cpp from source (needs cmake + a C++
# toolchain); it is NOT target-gated so it compiles on this Linux host as the DoD
# requires — only the `metal` GPU feature is mac-gated (added under a target dep).
# cpal (mic capture) IS mac-gated: the only platform Awili captures audio on, so
# Linux never builds it. hound is a tiny pure-Rust WAV (de)muxer for fixtures.
whisper-rs = { version = "0.14", default-features = false }
cpal = "0.15"
hound = "3"
# SHA-256 verification of auto-downloaded whisper models (review slice-3 SF4).
sha2 = "0.10"
# Markdown rendering in message bubbles (slice 6). pulldown-cmark parses the
# message source into events; awili-app maps them to styled gpui text runs —
# no webview, no HTML. `open` launches the default browser for link clicks.
pulldown-cmark = { version = "0.13", default-features = false }
open = "5"

# GPUI is patched to a small fork of Zed (upstream c83cef45 plus one squashed
# commit: a wgpu Suboptimal-frame fix, a text-layout cache fix, and making the
# GPL-3.0 tracing crates opt-in so they are not linked). The fork is pinned by
# commit, not branch, so `cargo update` cannot pull new fork code in silently.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/justinbukoski/zed-gpui-fork.git", rev = "c4192db5e3835dfa5ede8f4df8f33602d53bb6ba" }
gpui_platform = { git = "https://github.com/justinbukoski/zed-gpui-fork.git", rev = "c4192db5e3835dfa5ede8f4df8f33602d53bb6ba" }

# GitHub-pinned transitive git deps of the gpui fork, mirrored into gitea at the
# same revs (branch `pinned`) so any machine can fetch them. Some pinned revs
# (scap, font-kit) are no longer served by GitHub. Same revs, same code.
[patch."https://github.com/zed-industries/scap"]
zed-scap = { git = "https://github.com/justinbukoski/scap-mirror.git", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac" }

[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { git = "https://github.com/justinbukoski/font-kit-mirror.git", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269" }

[patch."https://github.com/zed-industries/wgpu.git"]
naga = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-core = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-core-deps-apple = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-core-deps-emscripten = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-hal = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-naga-bridge = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-types = { git = "https://github.com/justinbukoski/wgpu-mirror.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }

[patch."https://github.com/zed-industries/xim-rs.git"]
xim-ctext = { git = "https://github.com/justinbukoski/xim-rs-mirror.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8" }
xim-parser = { git = "https://github.com/justinbukoski/xim-rs-mirror.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8" }
zed-xim = { git = "https://github.com/justinbukoski/xim-rs-mirror.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8" }

[patch."https://github.com/proptest-rs/proptest"]
proptest = { git = "https://github.com/justinbukoski/proptest-mirror.git", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b" }
proptest-macro = { git = "https://github.com/justinbukoski/proptest-mirror.git", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b" }

# Keep ordinary development/tests from retaining one debug object per CGU in
# target/debug/deps on macOS. A huge flat deps directory made syspolicyd scan
# storms dominate compilation. Test inherits dev; assertions/checks stay on.
[profile.dev]
debug = false

# Opt in when source-level debugging is needed, without unpacked object files
# accumulating beside every proc macro. Packed symbols cost extra link time.
[profile.symbols]
inherits = "dev"
debug = true
split-debuginfo = "packed"
